<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>pane-loader demo</title>
  <!-- Released SolidOS, unmodified, from a public CDN. -->
  <link href="https://unpkg.com/mashlib@3.0.0/dist/mash.css" rel="stylesheet">
  <script defer src="https://unpkg.com/mashlib@3.0.0/dist/mashlib.min.js"></script>
  <style>
    /* fixed to the bottom, above everything: SolidOS's own header is fixed to the top and would cover it */
    #demo-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483000; font: 14px system-ui, sans-serif; background: #fff7d6; color: #1d2a26; border-top: 2px solid #0f766e; padding: 10px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: 0 -2px 10px rgba(0,0,0,.15) }
    body { padding-bottom: 64px }
    #demo-bar button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 0; background: #0f766e; color: #fff; cursor: pointer }
    #demo-bar code { background: #e8ebe6; padding: 1px 5px; border-radius: 4px }
    #demo-log { margin: 0; color: #46524d }
  </style>
</head>
<body id="PageBody" data-app-shell="databrowser">
  <div id="demo-bar">
    <strong>pane-loader demo</strong>
    <span>SolidOS <code>mashlib 3.0.0</code> showing a public folder.</span>
    <button id="demo-load">Load hello-pane.js</button>
    <p id="demo-log">Not loaded yet: SolidOS has its built-in panes only.</p>
  </div>
  <solid-ui-provider>
    <div class="app-main" tabindex="-1" aria-live="polite"><div class="app-shell">
      <main id="MainContent" class="app-view"><table id="OutlineView" class="outline-view" aria-label="Resource browser"></table></main>
    </div></div>
  </solid-ui-provider>
  <script type="module">
    // The thing on show: a public folder on another server.
    const SUBJECT = 'https://solidos.solidcommunity.net/public/SolidOS%20team%20meetings/2026/'
    const log = document.getElementById('demo-log')
    addEventListener('load', () => window.panes.runDataBrowser(SUBJECT))

    document.getElementById('demo-load').onclick = async () => {
      const before = window.panes.list.length
      const { loadPanes } = await import('./pane-loader.js')
      const results = await loadPanes([new URL('examples/hello-pane.js', location.href).href], { subject: SUBJECT, show: true })
      const r = results[0]
      log.textContent = r.ok
        ? 'Loaded "' + r.name + '". Panes registered: ' + before + ' → ' + window.panes.list.length + '.'
        : 'Skipped: ' + r.reason
      window.demoResult = { before, after: window.panes.list.length, results }
    }
  </script>
</body>
</html>
