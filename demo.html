<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>pane-loader: add a view to SolidOS from a URL</title>
  <meta name="description" content="Add a view to SolidOS from one file at a URL. A live demo: released SolidOS, and a calendar pane it has never seen, loaded at run time.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="pane-loader">
  <meta property="og:title" content="pane-loader: add a view to SolidOS from a URL">
  <meta property="og:description" content="A live demo: released SolidOS, and a calendar pane it has never seen, loaded at run time from one file. No build, no change to SolidOS.">
  <meta property="og:url" content="https://melvincarvalho.github.io/pane-loader/demo.html">
  <meta property="og:image" content="https://melvincarvalho.github.io/pane-loader/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="pane-loader: add a view to SolidOS from one file at a URL">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- Released SolidOS, unmodified, from a public CDN. -->
  <link href="https://unpkg.com/mashlib@3.0.0/dist/mash.css" rel="stylesheet">
  <script defer src="https://unpkg.com/mashlib@3.0.0/dist/mashlib.min.js"></script>
  <style>
    /* one control, bottom centre; everything else on the page is SolidOS */
    #demo { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 2147483000; display: grid; gap: 8px; justify-items: center;
      font: 15px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #1d1d1f }
    #demo .box { display: flex; gap: 2px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.82);
      -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
      box-shadow: 0 10px 34px rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.06) }
    #demo button { font: inherit; font-weight: 600; padding: 11px 24px; border-radius: 999px; border: 0; background: transparent; color: #1d1d1f; cursor: pointer;
      transition: background .2s, color .2s }
    #demo button.on { background: #7c4dff; color: #fff }
    #demo button:disabled { color: #86868b; font-weight: 500; cursor: default }
    #demo button:focus-visible { outline: 2px solid #7c4dff; outline-offset: 2px }
    #demo small { font-size: 12px; color: #86868b }
    #demo small a { color: inherit }
    #demo [hidden] { display: none }
  </style>
</head>
<body id="PageBody" data-app-shell="databrowser">
  <solid-ui-provider>
    <div class="app-main" tabindex="-1" aria-live="polite"><div class="app-shell">
      <main id="MainContent" class="app-view"><table id="OutlineView" class="outline-view" aria-label="Resource browser"></table></main>
    </div></div>
  </solid-ui-provider>

  <div id="demo">
    <div class="box">
      <button id="demo-load" disabled>Starting SolidOS…</button>
      <button id="demo-folder" hidden>Folder</button>
      <button id="demo-pane" class="on" hidden>Calendar</button>
    </div>
    <small id="demo-note" aria-live="polite" hidden></small>
  </div>

  <script type="module">
    import { loadPanes } from './pane-loader.js'

    // SolidOS on a public folder; the pane is examples/meetings-pane.js next to this page.
    const SUBJECT = 'https://solidos.solidcommunity.net/public/SolidOS%20team%20meetings/2026/'
    const PANE = new URL('examples/meetings-pane.js', location.href.split('?')[0]).href
    const $ = id => document.getElementById(id)
    let name = null

    // The button says "Starting SolidOS…" until the folder is on screen (or 20 s have passed).
    function ready () {
      const b = $('demo-load')
      if (!b.disabled) return
      b.disabled = false; b.classList.add('on'); b.textContent = 'Add a calendar view'
    }
    const watch = setInterval(() => {
      if (document.querySelectorAll('#OutlineView tr').length > 1) { clearInterval(watch); ready() }
    }, 100)
    setTimeout(() => { clearInterval(watch); ready() }, 20000)

    addEventListener('load', () => {
      window.panes.runDataBrowser(SUBJECT)
      if (new URL(location.href).searchParams.has('load')) setTimeout(load, 6000)   // demo.html?load presses the button for you
    })

    // Show the folder with SolidOS's own view, or with the loaded pane.
    function view (loadedPane) {
      const pane = loadedPane ? window.panes.byName(name) : undefined
      window.panes.getOutliner(document).GotoSubject(window.$rdf.sym(SUBJECT), true, pane, true, undefined)
      $('demo-pane').classList.toggle('on', loadedPane)
      $('demo-folder').classList.toggle('on', !loadedPane)
    }

    async function load () {
      const [r] = await loadPanes([PANE], { refresh: false })
      if (!r.ok) { $('demo-note').hidden = false; $('demo-note').textContent = 'Not loaded: ' + r.reason; return }
      name = r.name
      $('demo-load').hidden = true; $('demo-folder').hidden = false; $('demo-pane').hidden = false
      $('demo-note').hidden = false
      $('demo-note').innerHTML = 'Not built into SolidOS. <a href="https://github.com/melvincarvalho/pane-loader">Loaded from one file</a>'
      view(true)
    }

    $('demo-load').onclick = load
    $('demo-folder').onclick = () => view(false)
    $('demo-pane').onclick = () => view(true)
  </script>
</body>
</html>
